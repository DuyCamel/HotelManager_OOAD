# Mỗi thành viên copy thành config/database.properties rồi sửa trên máy mình.
# File database.properties bị gitignore; không commit tài khoản/mật khẩu thật.
# SQL Authentication — instance lắng nghe TCP cổng 1433 trên máy cá nhân:
db.url=jdbc:sqlserver://localhost:1433;databaseName=HotelManager_OOAD;encrypt=true;trustServerCertificate=true;loginTimeout=10;
db.user=hotel_dev
db.password=CHANGE_ME

# Nếu instance tên SQLEXPRESS dùng cổng cố định, giữ localhost:<cổng của bạn> phía trên.
# Nếu dùng SQL Browser thay cho cổng cố định, ví dụ:
# db.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=HotelManager_OOAD;encrypt=true;trustServerCertificate=true;loginTimeout=10;

# Windows Authentication: bỏ comment và thay dòng db.url phía trên; để user/password rỗng.
# Cần mssql-jdbc_auth-<version>-x64.dll cùng phiên bản driver trong java.library.path.
# db.url=jdbc:sqlserver://localhost:1433;databaseName=HotelManager_OOAD;integratedSecurity=true;encrypt=true;trustServerCertificate=true;loginTimeout=10;
# db.user=
# db.password=

# trustServerCertificate=true chỉ dành môi trường local với chứng chỉ tự ký.
# Có thể ghi đè bằng HOTEL_DB_URL / HOTEL_DB_USER / HOTEL_DB_PASSWORD (không ghi vào git).
